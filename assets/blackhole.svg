
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 506"
     width="900" height="506">

<defs>

    <radialGradient id="glow">
        <stop offset="0%" stop-color="#ffe9c2"
              stop-opacity="0.4"/>
        <stop offset="50%" stop-color="#c98a4a"
              stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#000"
              stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="doppler"
                    x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#6b4a30"
              stop-opacity="0.4"/>
        <stop offset="30%" stop-color="#e8d2a8"/>
        <stop offset="50%" stop-color="#fffdf6"/>
        <stop offset="70%" stop-color="#e8d2a8"/>
        <stop offset="100%" stop-color="#6b4a30"
              stop-opacity="0.4"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%"
            width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <filter id="big" x="-60%" y="-60%"
            width="220%" height="220%">
        <feGaussianBlur stdDeviation="8"/>
    </filter>

</defs>

