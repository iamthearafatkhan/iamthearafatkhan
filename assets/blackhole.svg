<!-- Outer Accretion Disk Glow Layers -->
<ellipse cx="450" cy="225" rx="280" ry="70" fill="none" stroke="#ff4500" stroke-width="35" opacity="0.35" filter="url(#glow-heavy)"/>
<ellipse cx="450" cy="225" rx="260" ry="55" fill="none" stroke="#ffaa00" stroke-width="20" opacity="0.5" filter="url(#glow-soft)"/>

<!-- Lensed Upper Ring (Light bending over the black hole shadow) -->
<path d="M 205 225 C 205 130, 695 130, 695 225" fill="none" stroke="url(#lens-grad)" stroke-width="14" filter="url(#glow-soft)"/>
<path d="M 205 225 C 205 130, 695 130, 695 225" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95"/>

<!-- Black Hole Event Horizon (Pure Black Core) -->
<circle cx="450" cy="225" r="55" fill="#000000"/>

<!-- Photon Sphere / Inner Rim White-Hot Ring -->
<circle cx="450" cy="225" r="57" fill="none" stroke="#ffeedd" stroke-width="4" filter="url(#glow-soft)" opacity="0.9"/>
<circle cx="450" cy="225" r="56" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="1"/>

<!-- Front Accretion Disk (Passing in front of the black hole) -->
