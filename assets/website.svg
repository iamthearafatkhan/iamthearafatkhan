<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://googleapis.com');
      
      .futuristic-text {
        font-family: 'Orbitron', 'Syncopate', sans-serif;
      }
    </style>
  </defs>

  <!-- Ocean blue glow layers -->
  <rect x="0" y="0" width="1200" height="120" rx="20" fill="none" stroke="#0066cc" stroke-width="16" stroke-opacity="0.15" />
  <rect x="2" y="2" width="1196" height="116" rx="18" fill="none" stroke="#0066cc" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Deep black background -->
  <rect x="4" y="4" width="1192" height="112" rx="16" fill="#0a0a0a" />
  
  <!-- Inner ocean‑blue glow -->
  <rect x="6" y="6" width="1188" height="108" rx="14" fill="none" stroke="#0066cc" stroke-width="10" stroke-opacity="0.25" />
  
  <!-- Sharp ocean‑blue border (bold) -->
  <rect x="4" y="4" width="1192" height="112" rx="16" fill="none" stroke="#0066cc" stroke-width="4" />
  
  <!-- Futuristic text – modern font stack, larger, bold -->
  <text x="600" y="78" font-size="52" class="futuristic-text" font-weight="700" fill="#0099ff" text-anchor="middle" letter-spacing="10">ARAFAT</text>
</svg>
