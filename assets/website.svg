<svg xmlns="http://www.w3.org/2000/svg" width="400" height="80" viewBox="0 0 400 80">
  <!-- Outer glow (red) -->
  <rect x="0" y="0" width="400" height="80" rx="20" fill="none" stroke="#ff0000" stroke-width="10" stroke-opacity="0.15" />
  <rect x="2" y="2" width="396" height="76" rx="18" fill="none" stroke="#ff0000" stroke-width="5" stroke-opacity="0.4" />
  
  <!-- Black background -->
  <rect x="4" y="4" width="392" height="72" rx="16" fill="#0a0a0a" />
  
  <!-- Inner glow (subtle red inside) -->
