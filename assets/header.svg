<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  
  <!-- Outer glow (soft border glow outside) -->
  <rect x="0" y="0" width="900" height="200" rx="20" fill="none" stroke="#ff0000" stroke-width="12" stroke-opacity="0.15" />
  <rect x="2" y="2" width="896" height="196" rx="18" fill="none" stroke="#ff0000" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Black background -->
  <rect x="4" y="4" width="892" height="192" rx="16" fill="#0a0a0a" />
  
  <!-- Inner glow (red wash inside near the border) -->
  <!-- This creates a soft red halo just inside the box -->
  <rect x="6" y="6" width="888" height="188" rx="14" fill="none" stroke="#ff0000" stroke-width="8" stroke-opacity="0.25" />
  
  <!-- Sharp red border -->
  <rect x="4" y="4" width="892" height="192" rx="16" fill="none" stroke="#ff0000" stroke-width="2" />
  
  <!-- Title -->
  <text x="450" y="60" font-size="34" font-family="monospace" font-weight="bold" fill="#e8fbff" text-anchor="middle" letter-spacing="2">ARAFAT KHAN</text>
  
  <!-- Subtitle -->
  <text x="450" y="105" font-size="20" font-family="monospace" fill="#e8fbff" text-anchor="middle">AI / ML ENGINEER IN PROGRESS</text>
  
  <!-- Tags -->
  <text x="450" y="150" font-size="16" font-family="monospace" fill="#6bdfff" text-anchor="middle">DATA SCIENCE · COMPUTER VISION · MACHINE LEARNING · RESEARCH</text>
</svg>
