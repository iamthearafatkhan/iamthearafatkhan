name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate dynamic stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: iamthearafatkhan
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          user = api(f"https://api.github.com/users/{username}")

          repos = []
          page = 1
          while True:
              batch = api(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          stars = sum(r.get("stargazers_count", 0) for r in repos)
          public_repos = user.get("public_repos", len(repos))

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """
          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req) as r:
                  gql = json.load(r)
              contributions = gql["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]
          except Exception:
              contributions = "SYNCING"

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
          <rect width="900" height="180" rx="18" fill="#02070e" stroke="#00d9ff"/>
          <style>
          .label{{font:700 16px monospace;fill:#00d9ff}}
          .value{{font:700 38px monospace;fill:#e8fbff}}
          .sub{{font:14px monospace;fill:#6bdfff}}
          </style>
          <text x="42" y="40" class="label">GITHUB.SYSTEM // LIVE METRICS</text>
          <text x="42" y="78" class="sub">PUBLIC REPOSITORIES</text>
          <text x="42" y="126" class="value">{public_repos}</text>
          <text x="330" y="78" class="sub">TOTAL STARS</text>
          <text x="330" y="126" class="value">{stars}</text>
          <text x="610" y="78" class="sub">CONTRIBUTIONS</text>
          <text x="610" y="126" class="value">{contributions}</text>
          <text x="42" y="158" class="sub">AUTO-SYNC // GitHub API</text>
          </svg>"""

          Path("assets/github-stats.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"
          git push
